{% if include.photos and include.photos.size > 0 %}
<div class="history-gallery">
  {% for photo in include.photos %}
  <figure class="history-photo">
    <a href="{{ photo.src | relative_url }}" target="_blank" rel="noopener">
      <img src="{{ photo.src | relative_url }}" alt="{{ photo.alt | default: photo.caption | default: 'Photo from the event' }}" loading="lazy">
    </a>
    {% if photo.caption %}<figcaption>{{ photo.caption }}</figcaption>{% endif %}
  </figure>
  {% endfor %}
</div>
{% endif %}
