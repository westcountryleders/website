# Venues page. `status` sorts each venue into a section:
#   regular   - happening now, on a schedule ("Regular meet-ups")
#   occasional - as and when, nothing scheduled
#   paused    - temporarily closed or on hold
# For a repeating meet-up, `next_date` (YYYY-MM-DD) plus `repeat_days` lets the page
# show the next upcoming date automatically (e.g. 14 for fortnightly).

- title: "Replay"
  status: regular
  frequency: "Fortnightly, Thursdays"
  next_date: "2026-10-29"
  repeat_days: 14
  time: "18:30 - 22:00"
  price: "£4 / evening"
  url: "#replay"
  badge: "Café"
  badge_style: "teal"
  address: "196 Cheltenham Rd, Montpelier, BS6 5RB"
  image: "/assets/img/Replay combine.png"
  description: >
    Our regular evening of Root, Arcs and more at Replay, one of the nicest board game
    cafés in Bristol. It runs every other Thursday from 6:30pm to 10pm, and it's £4 for
    the evening. Replay kindly advertise it on their Meetup page too, so sign up there
    or let us know on Discord.
  links:
    - { name: "Meetup page", url: "https://www.meetup.com/board-game-social/" }
    - { name: "Our Discord", url: "https://discord.gg/JuuxmmbgG7" }
  map_iframe: '<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5911.537230877614!2d-2.5973041727780974!3d51.46742346539875!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x48718e0b9ea095cf%3A0x8a40fd52ead5f683!2sReplay%20Bristol%20Board%20Game%20Cafe!5e0!3m2!1sen!2suk!4v1738507615351!5m2!1sen!2suk" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>'

- title: "D&D: The West Country Marches"
  status: regular
  frequency: "Regular sessions"
  time: "See Discord"
  price: "See Discord"
  url: "#west-country-marches"
  badge: "D&D"
  badge_style: "crimson"
  address: "Arranged on our Discord"
  description: >
    Katie's drop-in Dungeons & Dragons campaign, set in the land of Umber. There's no
    fixed party: each session, whoever can make it picks a quest and sets out from the
    city of Lilyhaven. Sessions are arranged in the West Country Marches channels on our
    Discord, and you can read the story so far on our History page.
  links:
    - { name: "The story so far", url: "/history/#d-d-the-west-country-marches" }
    - { name: "Our Discord", url: "https://discord.gg/JuuxmmbgG7" }
  map_iframe: ""

